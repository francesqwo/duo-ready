name: Scan App Store for iPhone Duo-ready apps

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; runs converge on the full set
  workflow_dispatch:
    inputs:
      app:
        description: "Optional: app name or App Store id to add to the watchlist"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: duo-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --quiet requests

      - name: Add requested app to the watchlist
        if: ${{ inputs.app != '' }}
        env:
          APP: ${{ inputs.app }}
        run: python3 scraper/scan.py --add "$APP"

      - name: Scan the App Store
        env:
          RESUME: "1"            # reuse records already refreshed today
          BUDGET_SECONDS: "600"  # stop and commit; the next run fills the gaps
          MIN_INTERVAL: "1.2"
          RECHECK_DAYS: "30"     # don't re-check known Duo-ready apps for a month
        run: python3 scraper/scan.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/apps.json docs/data/meta.json docs/data/watchlist.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            summary=$(python3 -c "import json;d=json.load(open('docs/data/meta.json'));t=d['totals'];print(f\"{t['duoReady']}/{t['tracked']} Duo-ready\")")
            git commit -m "data: ${summary} ($(date -u +%Y-%m-%d))"
            git push
          fi
